# ============================================================
# tpl.franj2.top — Tie Public License website
# OpenResty / nginx configuration (1Panel compatible)
#
# 1Panel 部署步骤：
#   1. 网站 → 创建网站 → 静态站点，域名填 tpl.franj2.top
#   2. 网站目录指向本仓库的检出根（含 en/ zh/ assets/ 的目录）
#   3. 将本文件中 map 块粘贴到 http 级配置：
#      1Panel → 网站 → 配置文件（OpenResty 主配置）http {} 段内，
#      或 conf.d 下任一 http 级包含文件（map 不能放 server 内）
#   4. 将下面 server 块中「语言协商」部分合并进 1Panel 为该站点
#      生成的 server 配置（或直接替换，再按需补 1Panel 的证书段）
#   5. SSL：用 1Panel 证书面板为 tpl.franj2.top 申请/部署证书，
#      证书段由 1Panel 生成，无需手写
# ============================================================

# ---------- http 级：Accept-Language 协商 ----------
# 取浏览器首选语言；只认 zh 系，其余一律 en（英文为准）
map $http_accept_language $tpl_al_lang {
    default            en;
    ~*^\s*zh           zh;
    ~*(?:,|\s)zh       zh;
}

# ---------- server 块（80，仅负责跳转与静态伺服；443 由 1Panel 证书段托管） ----------
server {
    listen 80;
    server_name tpl.franj2.top;

    # 站点根 = 本仓库检出根
    root /opt/1panel/www/sites/tpl.franj2.top/index;
    index index.html;

    # gzip：静态文本收益明显
    gzip on;
    gzip_types text/html text/css text/plain application/javascript;
    gzip_min_length 1024;

    # ---------- 语言协商 ----------
    # 用户手动切换写入的 cookie 优先于请求头（选择权在用户）
    set $tpl_lang $tpl_al_lang;
    if ($cookie_tpl_lang) {
        set $tpl_lang $cookie_tpl_lang;
    }

    # 手动切换端点：/lang/en、/lang/zh —— 写偏好 cookie 后跳转，全程零 JS
    location = /lang/en {
        add_header Set-Cookie "tpl_lang=en; Path=/; Max-Age=31536000; SameSite=Lax" always;
        return 302 /en/;
    }
    location = /lang/zh {
        add_header Set-Cookie "tpl_lang=zh; Path=/; Max-Age=31536000; SameSite=Lax" always;
        return 302 /zh/;
    }

    # 根路径：按协商结果 302（无头/爬虫/无头浏览器默认落英文）
    location = / {
        return 302 /$tpl_lang/;
    }

    # ---------- 静态资源 ----------
    location / {
        try_files $uri $uri/ =404;
    }

    # 纯文本许可证：按字节流伺服，charset 显式 UTF-8
    location ~* \.txt$ {
        default_type text/plain;
        charset utf-8;
    }

    # CSS 长缓存（文件名不变，更新靠主动刷新）
    location ~* ^/assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 旧链接兜底：/index.html 直连时同样协商
    location = /index.html {
        return 302 /$tpl_lang/;
    }
}

